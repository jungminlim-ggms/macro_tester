services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: macro_tester
      POSTGRES_USER: macro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run node scripts/setup.mjs first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macro -d macro_tester"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://macro:${DB_PASSWORD}@db:5432/macro_tester
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Run setup first}
      TEST_PASSWORD: ${TEST_PASSWORD:?Run setup first}
      TOKEN_SECRET: ${TOKEN_SECRET:?Run setup first}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://jungminlim-ggms.github.io,http://localhost:8080,http://127.0.0.1:8080}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
